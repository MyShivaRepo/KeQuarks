<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>KeQuarks</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="https://github.com/MyShivaRepo/KeQuarks" target="_blank" rel="noopener"
       title="Open the KeQuarks GitHub repository">🧩 KeQuarks</a>
    <div class="base-picker">
      <label for="baseSelect">Base:</label>
      <select id="baseSelect"></select>
      <button id="newBaseBtn" title="New base">＋</button>
      <button id="renameBaseBtn" title="Rename base">✎</button>
      <button id="deleteBaseBtn" title="Delete base">🗑</button>
    </div>
    <div class="search">
      <input id="searchInput" type="search" placeholder="Search a node…">
    </div>
  </header>

  <nav class="tabs">
    <button class="tab active" data-tab="text">Knowledge Base</button>
    <button class="tab" data-tab="centered">Centered text view</button>
    <button class="tab" data-tab="cgraph">Centered graph view</button>
    <button class="tab" data-tab="graph">Graph view</button>
    <button class="tab" data-tab="rules">Rules</button>
    <button class="tab" data-tab="model">Model</button>
    <button class="tab" data-tab="meta">Meta-Model</button>
  </nav>

  <main>
    <div id="tab-text" class="tabpane active">
      <div id="textView"></div>
    </div>
    <div id="tab-centered" class="tabpane">
      <div id="centeredView"></div>
    </div>
    <div id="tab-cgraph" class="tabpane">
      <div class="graph-toolbar">
        <span class="spacer"></span>
        <label for="cgDepth">Depth:</label>
        <select id="cgDepth">
          <option value="1">1 (direct)</option>
          <option value="2">2</option>
          <option value="3">3</option>
        </select>
      </div>
      <p class="hint" id="cgraphHint"></p>
      <div id="cyCentered"></div>
    </div>
    <div id="tab-rules" class="tabpane">
      <div id="rulesView"></div>
    </div>
    <div id="tab-model" class="tabpane">
      <div id="modelView"></div>
    </div>
    <div id="tab-meta" class="tabpane">
      <div id="metaView"></div>
    </div>
    <div id="tab-graph" class="tabpane">
      <div class="graph-toolbar">
        <span class="spacer"></span>
        <label for="graphScope">Show:</label>
        <select id="graphScope">
          <option value="all">All</option>
          <option value="model">Model</option>
          <option value="kb">Knowledge Base</option>
        </select>
        <label for="graphLayout">Layout:</label>
        <select id="graphLayout">
          <option value="cose">Force-directed</option>
          <option value="breadthfirst">Hierarchical</option>
          <option value="concentric">Concentric</option>
          <option value="circle">Circle</option>
          <option value="grid">Grid</option>
        </select>
        <button id="graphRelayout" title="Re-layout">Re-layout</button>
      </div>
      <div id="cy"></div>
    </div>
  </main>

  <div id="toast" class="toast"></div>

  <script src="js/vendor/cytoscape.min.js"></script>
  <script src="js/api.js"></script>
  <script src="js/graph.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
