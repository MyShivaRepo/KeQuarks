upstream kequarks_backend {
    server backend:8000;
}

server {
    listen 80;
    server_name localhost;
    root /usr/share/nginx/html;
    index index.html;

    # API + doc interactive (Swagger) proxifiées vers le backend → tout sur un port.
    location ~ ^/(api|docs|openapi.json)(/|$) {
        proxy_pass http://kequarks_backend$request_uri;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 120s;
    }

    # Assets JS/CSS — pas de cache en dev.
    location ~* \.(js|css)$ {
        try_files $uri =404;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate";
    }
}
